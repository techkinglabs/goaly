# Main compose: PostgreSQL runs as an INTERNAL service (named volume persistence).
# The backend connects to it via the in-network "postgres" host.
# For the previous external-DB setup, use docker-compose.external-db.yml.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goaly_db}
      POSTGRES_USER: ${POSTGRES_USER:-goaly_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goaly_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goaly_user} -d ${POSTGRES_DB:-weekly_progress_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-goaly_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-goaly_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-goaly_password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
